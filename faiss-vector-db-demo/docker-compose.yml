services:
  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: qdrant-faiss-demo
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build:
      context: ./app
    container_name: faiss-vector-demo-app
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      TEXT_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      DATA_DIR: /app/data
    volumes:
      - app_data:/app/data

volumes:
  qdrant_data:
  app_data:
